[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automation-template"
version = "0.1.0"
description = "Plantilla pequeña y extensible para scripts de automatización en Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
automation = "automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
